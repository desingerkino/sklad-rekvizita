name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check imports
        run: python tests/check_imports.py
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"

      - name: Build exe (PyInstaller)
        run: pyinstaller build/sklad.spec --noconfirm
        env:
          PYTHONUTF8: "1"

      - name: Check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/SkladRekvizita/SkladRekvizita.exe)) { throw "exe not built" }
          Get-ChildItem dist/SkladRekvizita | Select-Object -First 10

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc build/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: SkladRekvizita-Setup
          path: dist/SkladRekvizita_Setup_*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SkladRekvizita-portable
          path: dist/SkladRekvizita/
